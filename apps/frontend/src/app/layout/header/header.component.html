<mat-toolbar color="primary" class="app-header">
  <div class="header-container">
    <!-- Logo -->
    <div class="logo-section">
      <a routerLink="/" class="logo-link">
        <mat-icon class="logo-icon">shopping_cart</mat-icon>
        <span class="logo-text">E-Commerce</span>
      </a>
    </div>

    <!-- Search Bar (Hidden on mobile) -->
    <div class="search-section" *ngIf="!(isHandset$ | async)">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search products...</mat-label>
        <input
          matInput
          #searchInput
          (keyup.enter)="onSearch(searchInput.value)"
          placeholder="Search products...">
        <mat-icon matSuffix (click)="onSearch(searchInput.value)" class="search-icon">search</mat-icon>
      </mat-form-field>
    </div>

    <!-- Actions Section -->
    <div class="actions-section">
      <!-- Mobile Search Button -->
      <button
        mat-icon-button
        *ngIf="isHandset$ | async"
        class="mobile-search-btn"
        title="Search">
        <mat-icon>search</mat-icon>
      </button>

      <!-- Cart Button -->
      <button
        mat-icon-button
        (click)="onCartClick()"
        class="cart-btn"
        title="Shopping Cart">
        <mat-icon [matBadge]="cartItemCount" matBadgeColor="accent" [matBadgeHidden]="cartItemCount === 0">
          shopping_cart
        </mat-icon>
      </button>

      <!-- User Menu -->
      <div class="user-menu" *ngIf="currentUser$ | async as user; else loginSection">
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
          <mat-icon>account_circle</mat-icon>
          <span class="user-name" *ngIf="!(isHandset$ | async)">{{ user.firstName }}</span>
          <mat-icon>arrow_drop_down</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item routerLink="/profile">
            <mat-icon>person</mat-icon>
            <span>Profile</span>
          </button>
          <button mat-menu-item routerLink="/orders">
            <mat-icon>history</mat-icon>
            <span>Order History</span>
          </button>
          <button mat-menu-item *ngIf="user.isAdmin" routerLink="/admin">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Admin Panel</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </div>

      <!-- Login/Register Section -->
      <ng-template #loginSection>
        <div class="auth-buttons">
          <button mat-button routerLink="/auth/login" class="login-btn">
            <mat-icon *ngIf="!(isHandset$ | async)">login</mat-icon>
            <span>Login</span>
          </button>
          <button mat-raised-button color="accent" routerLink="/auth/register" class="register-btn">
            <span>Sign Up</span>
          </button>
        </div>
      </ng-template>

      <!-- Mobile Menu Button -->
      <button
        mat-icon-button
        *ngIf="isHandset$ | async"
        class="mobile-menu-btn"
        title="Menu">
        <mat-icon>menu</mat-icon>
      </button>
    </div>
  </div>
</mat-toolbar>
