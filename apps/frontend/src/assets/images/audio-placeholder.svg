<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headphoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)" rx="12"/>

  <!-- Headphones -->
  <g transform="translate(200, 200)">
    <!-- Headband -->
    <path d="M-80 -20 Q0 -60 80 -20" fill="none" stroke="url(#headphoneGradient)" stroke-width="12" stroke-linecap="round"/>
    <path d="M-75 -18 Q0 -55 75 -18" fill="none" stroke="#95a5a6" stroke-width="6" stroke-linecap="round"/>

    <!-- Left ear cup -->
    <circle cx="-60" cy="0" r="35" fill="url(#headphoneGradient)"/>
    <circle cx="-60" cy="0" r="30" fill="#34495e"/>
    <circle cx="-60" cy="0" r="25" fill="#2c3e50"/>
    <circle cx="-60" cy="0" r="20" fill="#1a1a1a"/>

    <!-- Right ear cup -->
    <circle cx="60" cy="0" r="35" fill="url(#headphoneGradient)"/>
    <circle cx="60" cy="0" r="30" fill="#34495e"/>
    <circle cx="60" cy="0" r="25" fill="#2c3e50"/>
    <circle cx="60" cy="0" r="20" fill="#1a1a1a"/>

    <!-- Speaker grilles -->
    <g opacity="0.6">
      <!-- Left speaker holes -->
      <circle cx="-60" cy="-10" r="2" fill="#7f8c8d"/>
      <circle cx="-60" cy="0" r="2" fill="#7f8c8d"/>
      <circle cx="-60" cy="10" r="2" fill="#7f8c8d"/>
      <circle cx="-70" cy="-5" r="2" fill="#7f8c8d"/>
      <circle cx="-70" cy="5" r="2" fill="#7f8c8d"/>
      <circle cx="-50" cy="-5" r="2" fill="#7f8c8d"/>
      <circle cx="-50" cy="5" r="2" fill="#7f8c8d"/>

      <!-- Right speaker holes -->
      <circle cx="60" cy="-10" r="2" fill="#7f8c8d"/>
      <circle cx="60" cy="0" r="2" fill="#7f8c8d"/>
      <circle cx="60" cy="10" r="2" fill="#7f8c8d"/>
      <circle cx="70" cy="-5" r="2" fill="#7f8c8d"/>
      <circle cx="70" cy="5" r="2" fill="#7f8c8d"/>
      <circle cx="50" cy="-5" r="2" fill="#7f8c8d"/>
      <circle cx="50" cy="5" r="2" fill="#7f8c8d"/>
    </g>

    <!-- Adjustment hinges -->
    <rect x="-65" y="-25" width="10" height="8" fill="#95a5a6" rx="2"/>
    <rect x="55" y="-25" width="10" height="8" fill="#95a5a6" rx="2"/>

    <!-- Cable -->
    <path d="M-60 35 Q-50 50 -30 55 Q0 60 30 55 Q50 50 60 35" fill="none" stroke="#2c3e50" stroke-width="4"/>

    <!-- Connector -->
    <rect x="55" y="50" width="15" height="8" fill="#34495e" rx="2"/>
    <rect x="58" y="52" width="9" height="4" fill="#ecf0f1" rx="1"/>

    <!-- Sound waves -->
    <g opacity="0.4">
      <path d="M-100 0 Q-90 -10 -100 -20" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M-105 0 Q-95 -15 -105 -30" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M100 0 Q90 -10 100 -20" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M105 0 Q95 -15 105 -30" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Brand logo placeholder -->
    <rect x="-8" y="-45" width="16" height="6" fill="#ecf0f1" opacity="0.8" rx="2"/>
  </g>

  <!-- Text -->
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="500">Audio</text>
  <text x="200" y="345" font-family="Arial, sans-serif" font-size="14" fill="#ecf0f1" text-anchor="middle">Coming Soon</text>
</svg>