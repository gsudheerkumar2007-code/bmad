<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5f3dc4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)" rx="12"/>

  <!-- Book -->
  <g transform="translate(200, 200)">
    <!-- Book cover -->
    <rect x="-50" y="-80" width="100" height="160" fill="url(#bookGradient)" rx="4"/>

    <!-- Book spine -->
    <rect x="-55" y="-80" width="10" height="160" fill="url(#spineGradient)" rx="2"/>

    <!-- Pages -->
    <rect x="-45" y="-75" width="90" height="150" fill="#f8f9fa" rx="2"/>
    <rect x="-40" y="-70" width="80" height="140" fill="#ffffff" rx="2"/>

    <!-- Book title area -->
    <rect x="-40" y="-60" width="80" height="30" fill="#8e44ad" opacity="0.1" rx="2"/>

    <!-- Title lines -->
    <rect x="-35" y="-55" width="60" height="3" fill="#8e44ad" opacity="0.8" rx="1"/>
    <rect x="-35" y="-45" width="40" height="2" fill="#8e44ad" opacity="0.6" rx="1"/>

    <!-- Text lines -->
    <rect x="-35" y="-20" width="70" height="2" fill="#6c757d" opacity="0.4" rx="1"/>
    <rect x="-35" y="-10" width="65" height="2" fill="#6c757d" opacity="0.4" rx="1"/>
    <rect x="-35" y="0" width="70" height="2" fill="#6c757d" opacity="0.4" rx="1"/>
    <rect x="-35" y="10" width="60" height="2" fill="#6c757d" opacity="0.4" rx="1"/>
    <rect x="-35" y="20" width="68" height="2" fill="#6c757d" opacity="0.4" rx="1"/>
    <rect x="-35" y="30" width="55" height="2" fill="#6c757d" opacity="0.4" rx="1"/>
    <rect x="-35" y="40" width="72" height="2" fill="#6c757d" opacity="0.4" rx="1"/>
    <rect x="-35" y="50" width="50" height="2" fill="#6c757d" opacity="0.4" rx="1"/>

    <!-- Book corner shadow -->
    <path d="M45 75 L50 80 L45 80 Z" fill="#000000" opacity="0.2"/>

    <!-- Bookmark -->
    <rect x="30" y="-80" width="6" height="50" fill="#e74c3c" rx="1"/>
    <path d="M30 -30 L36 -30 L33 -25 Z" fill="#e74c3c"/>

    <!-- Cover highlights -->
    <rect x="-50" y="-80" width="100" height="20" fill="#ffffff" opacity="0.1" rx="4"/>
  </g>

  <!-- Text -->
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="18" fill="#8e44ad" text-anchor="middle" font-weight="500">Book</text>
  <text x="200" y="345" font-family="Arial, sans-serif" font-size="14" fill="#9b59b6" text-anchor="middle">Coming Soon</text>
</svg>