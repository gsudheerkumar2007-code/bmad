<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c2c2c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)" rx="12"/>

  <!-- Phone body -->
  <g transform="translate(200, 200)">
    <rect x="-50" y="-90" width="100" height="180" fill="url(#phoneGradient)" rx="20"/>

    <!-- Screen -->
    <rect x="-40" y="-75" width="80" height="140" fill="url(#screenGradient)" rx="15"/>

    <!-- Home button -->
    <circle cx="0" cy="75" r="8" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>

    <!-- Speaker -->
    <rect x="-15" y="-85" width="30" height="3" fill="#2c3e50" rx="2"/>

    <!-- Camera -->
    <circle cx="20" cy="-85" r="3" fill="#2c3e50"/>

    <!-- Screen reflection -->
    <rect x="-40" y="-75" width="80" height="140" fill="url(#screenGradient)" opacity="0.3" rx="15"/>
    <rect x="-35" y="-70" width="25" height="60" fill="#ffffff" opacity="0.1" rx="5"/>

    <!-- Screen icons (app icons simulation) -->
    <circle cx="-20" cy="-40" r="8" fill="#3498db" opacity="0.7"/>
    <circle cx="0" cy="-40" r="8" fill="#e74c3c" opacity="0.7"/>
    <circle cx="20" cy="-40" r="8" fill="#2ecc71" opacity="0.7"/>

    <circle cx="-20" cy="-15" r="8" fill="#f39c12" opacity="0.7"/>
    <circle cx="0" cy="-15" r="8" fill="#9b59b6" opacity="0.7"/>
    <circle cx="20" cy="-15" r="8" fill="#1abc9c" opacity="0.7"/>
  </g>

  <!-- Text -->
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="500">Smartphone</text>
  <text x="200" y="345" font-family="Arial, sans-serif" font-size="14" fill="#ecf0f1" text-anchor="middle">Coming Soon</text>
</svg>