<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dumbbellGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)" rx="12"/>

  <!-- Dumbbell -->
  <g transform="translate(200, 200)">
    <!-- Handle -->
    <rect x="-50" y="-8" width="100" height="16" fill="url(#dumbbellGradient)" rx="8"/>

    <!-- Handle grip -->
    <rect x="-45" y="-6" width="90" height="3" fill="#7f8c8d" rx="1"/>
    <rect x="-45" y="0" width="90" height="3" fill="#7f8c8d" rx="1"/>
    <rect x="-45" y="3" width="90" height="3" fill="#7f8c8d" rx="1"/>

    <!-- Left weight -->
    <circle cx="-60" cy="0" r="25" fill="url(#dumbbellGradient)"/>
    <circle cx="-60" cy="0" r="20" fill="#95a5a6"/>
    <circle cx="-60" cy="0" r="15" fill="url(#dumbbellGradient)"/>

    <!-- Right weight -->
    <circle cx="60" cy="0" r="25" fill="url(#dumbbellGradient)"/>
    <circle cx="60" cy="0" r="20" fill="#95a5a6"/>
    <circle cx="60" cy="0" r="15" fill="url(#dumbbellGradient)"/>

    <!-- Weight plates details -->
    <circle cx="-60" cy="0" r="8" fill="#ecf0f1" opacity="0.3"/>
    <circle cx="60" cy="0" r="8" fill="#ecf0f1" opacity="0.3"/>

    <!-- Weight numbers -->
    <text x="-60" y="5" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text>
    <text x="60" y="5" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text>

    <!-- Motion lines -->
    <path d="M-90 -40 Q-85 -35 -90 -30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <path d="M-95 -35 Q-90 -30 -95 -25" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <path d="M90 -40 Q95 -35 90 -30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <path d="M95 -35 Q100 -30 95 -25" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

    <!-- Highlights -->
    <ellipse cx="-60" cy="-15" rx="8" ry="5" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="60" cy="-15" rx="8" ry="5" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Text -->
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="18" fill="#e91e63" text-anchor="middle" font-weight="500">Fitness</text>
  <text x="200" y="345" font-family="Arial, sans-serif" font-size="14" fill="#f06292" text-anchor="middle">Coming Soon</text>
</svg>