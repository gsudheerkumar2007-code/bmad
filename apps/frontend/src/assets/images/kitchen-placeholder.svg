<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdbb2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c1c3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="applianceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bdc3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#95a5a6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)" rx="12"/>

  <!-- Coffee Maker -->
  <g transform="translate(200, 220)">
    <!-- Base -->
    <rect x="-60" y="40" width="120" height="30" fill="url(#applianceGradient)" rx="8"/>

    <!-- Water reservoir -->
    <rect x="-55" y="-60" width="110" height="100" fill="url(#applianceGradient)" rx="8"/>

    <!-- Control panel -->
    <rect x="-50" y="-40" width="100" height="30" fill="#2c3e50" rx="4"/>

    <!-- Display -->
    <rect x="-40" y="-35" width="30" height="20" fill="#1a1a1a" rx="2"/>
    <rect x="-35" y="-32" width="20" height="3" fill="#3498db"/>
    <rect x="-35" y="-25" width="15" height="2" fill="#27ae60"/>

    <!-- Buttons -->
    <circle cx="0" cy="-25" r="6" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <circle cx="20" cy="-25" r="6" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <circle cx="40" cy="-25" r="6" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>

    <!-- Coffee pot -->
    <ellipse cx="-20" cy="10" rx="25" ry="35" fill="#34495e"/>
    <rect x="-45" y="-20" width="50" height="30" fill="#34495e"/>
    <ellipse cx="-20" cy="-20" rx="25" ry="8" fill="#2c3e50"/>

    <!-- Handle -->
    <path d="M5 -10 Q15 -10 15 0 Q15 10 5 10" fill="none" stroke="#2c3e50" stroke-width="3"/>

    <!-- Spout -->
    <path d="M-45 -15 Q-50 -15 -50 -10" fill="none" stroke="#2c3e50" stroke-width="3"/>

    <!-- Coffee level -->
    <rect x="-40" y="-5" width="40" height="20" fill="#8b4513" opacity="0.8" rx="2"/>

    <!-- Steam -->
    <path d="M-30 -30 Q-28 -40 -30 -50" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <path d="M-20 -30 Q-18 -45 -20 -55" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <path d="M-10 -30 Q-8 -40 -10 -50" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

    <!-- Light indicator -->
    <circle cx="30" cy="-50" r="3" fill="#e74c3c"/>
  </g>

  <!-- Text -->
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50" text-anchor="middle" font-weight="500">Kitchen</text>
  <text x="200" y="355" font-family="Arial, sans-serif" font-size="14" fill="#34495e" text-anchor="middle">Coming Soon</text>
</svg>