<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="laptopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95a5a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7f8c8d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)" rx="12"/>

  <!-- Laptop -->
  <g transform="translate(200, 240)">
    <!-- Base/Keyboard -->
    <ellipse cx="0" cy="40" rx="100" ry="20" fill="url(#laptopGradient)"/>
    <rect x="-90" y="20" width="180" height="40" fill="url(#laptopGradient)" rx="8"/>

    <!-- Screen -->
    <rect x="-85" y="-80" width="170" height="100" fill="url(#screenGradient)" rx="8"/>
    <rect x="-75" y="-70" width="150" height="80" fill="#1a1a1a" rx="4"/>

    <!-- Screen content -->
    <rect x="-70" y="-65" width="140" height="8" fill="#3498db" opacity="0.8"/>
    <rect x="-70" y="-50" width="100" height="4" fill="#ecf0f1" opacity="0.6"/>
    <rect x="-70" y="-40" width="120" height="4" fill="#ecf0f1" opacity="0.6"/>
    <rect x="-70" y="-30" width="80" height="4" fill="#ecf0f1" opacity="0.6"/>

    <!-- Keyboard -->
    <g transform="translate(0, 30)">
      <!-- Keyboard keys -->
      <rect x="-60" y="-10" width="120" height="20" fill="#bdc3c7" rx="2"/>
      <!-- Individual keys simulation -->
      <rect x="-55" y="-8" width="6" height="6" fill="#ecf0f1" rx="1"/>
      <rect x="-45" y="-8" width="6" height="6" fill="#ecf0f1" rx="1"/>
      <rect x="-35" y="-8" width="6" height="6" fill="#ecf0f1" rx="1"/>
      <rect x="-25" y="-8" width="6" height="6" fill="#ecf0f1" rx="1"/>
      <rect x="-15" y="-8" width="6" height="6" fill="#ecf0f1" rx="1"/>
      <rect x="-5" y="-8" width="6" height="6" fill="#ecf0f1" rx="1"/>
      <rect x="5" y="-8" width="6" height="6" fill="#ecf0f1" rx="1"/>
      <rect x="15" y="-8" width="6" height="6" fill="#ecf0f1" rx="1"/>
      <rect x="25" y="-8" width="6" height="6" fill="#ecf0f1" rx="1"/>
      <rect x="35" y="-8" width="6" height="6" fill="#ecf0f1" rx="1"/>
      <rect x="45" y="-8" width="6" height="6" fill="#ecf0f1" rx="1"/>

      <!-- Trackpad -->
      <rect x="-20" y="5" width="40" height="20" fill="#95a5a6" rx="4"/>
    </g>

    <!-- Apple logo simulation -->
    <circle cx="0" cy="-100" r="4" fill="#ecf0f1" opacity="0.8"/>
  </g>

  <!-- Text -->
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="500">Laptop</text>
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="14" fill="#ecf0f1" text-anchor="middle">Coming Soon</text>
</svg>